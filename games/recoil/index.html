<title>Recoil</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Silkscreen:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap">
<style>
  :root{
    --void:#08090c; --void-2:#111319; --void-3:#181b22;
    --steel:#2a2e38; --steel-lit:#454b59;
    --ember:#ff8a3d; --ember-hi:#ffc79a;
    --ice:#7fd8e8;
    --ink:#e7ecf2; --ink-2:#9aa3b2; --ink-3:#5b6270;
    --frame:#242833;
  }
  *{box-sizing:border-box}
  body{
    background:var(--void); color:var(--ink);
    font-family:"Newsreader",Georgia,serif;
    margin:0; padding-block:22px 40px; padding-left:16px; padding-right:16px;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
    background-image:radial-gradient(120% 90% at 50% 0%, #14161d 0%, var(--void) 62%);
  }
  .wrap{width:100%; max-width:800px; display:flex; flex-direction:column; gap:16px}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap}
  h1{
    font-family:"Jacquard 12",serif; font-weight:400;
    font-size:clamp(46px,11vw,72px); line-height:.78; margin:0;
    color:var(--ember); text-shadow:0 0 18px rgba(255,138,61,.32);
    letter-spacing:.02em;
  }
  .tag{font-size:13px; color:var(--ink-3); font-style:italic; margin:6px 0 0; max-width:46ch; line-height:1.5}
  .scoreboard{
    font-family:"Silkscreen",monospace; font-size:11px; letter-spacing:.09em;
    display:flex; gap:16px; align-items:baseline; color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }
  .scoreboard b{color:var(--ink); font-weight:400}

  .ribbon{display:flex; gap:5px; flex-wrap:wrap}
  .ribbon button{
    font-family:"Silkscreen",monospace; font-size:10px; letter-spacing:.06em;
    background:var(--void-2); color:var(--ink-3); border:1px solid var(--frame);
    padding:5px 7px; cursor:pointer; min-width:32px;
  }
  .ribbon button:hover{color:var(--ink); border-color:var(--steel-lit)}
  .ribbon button.done{color:var(--ice); border-color:#2c4a4f}
  .ribbon button[aria-current="true"]{background:var(--ember); border-color:var(--ember); color:#1f1006}

  .stage{display:flex; gap:14px; align-items:stretch}
  .boardbox{position:relative; flex:1 1 auto; min-width:0}
  canvas{
    display:block; width:100%; height:auto; image-rendering:pixelated;
    border:1px solid var(--frame); background:#050608;
  }
  .glow{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 60px rgba(4,5,7,.75)}

  .teach{font-size:16px; font-style:italic; color:var(--ink-2); margin:0; max-width:64ch; min-height:3.4em; line-height:1.45}
  .teach .lv{
    font-style:normal; font-family:"Silkscreen",monospace; font-size:11px;
    letter-spacing:.12em; color:var(--ice); display:block; margin-bottom:6px;
  }
  .flash{min-height:1.4em; font-family:"Silkscreen",monospace; font-size:10px; letter-spacing:.06em; color:var(--ember-hi); margin:0}

  .controls{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
  .pad{display:grid; grid-template-columns:repeat(3,42px); grid-template-rows:repeat(2,42px); gap:4px}
  .pad button,.btn{
    font-family:"Silkscreen",monospace;
    background:var(--void-2); color:var(--ink-2); border:1px solid var(--frame);
    cursor:pointer; touch-action:manipulation;
  }
  .pad button{font-size:13px; padding:0}
  .pad button:active,.btn:active{background:var(--steel)}
  .pad button:hover,.btn:hover{color:var(--ink); border-color:var(--steel-lit)}
  .pad .u{grid-column:2; grid-row:1}
  .pad .l{grid-column:1; grid-row:2}
  .pad .d{grid-column:2; grid-row:2}
  .pad .r{grid-column:3; grid-row:2}
  .btnrow{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
  .btn{padding:9px 12px; font-size:10px; letter-spacing:.08em}
  .keys{font-family:"Silkscreen",monospace; font-size:9px; color:var(--ink-3); letter-spacing:.06em; line-height:2; margin:0}
  .keys kbd{color:var(--ink-2); background:var(--void-2); border:1px solid var(--frame); padding:1px 4px}

  .won{position:absolute; inset:0; display:none; place-content:center; text-align:center; background:rgba(5,6,8,.9); padding:18px}
  .won.show{display:grid}
  .won h3{font-family:"Jacquard 12",serif; font-weight:400; font-size:46px; margin:0 0 4px; color:var(--ember)}
  .won p{margin:0 0 14px; font-size:14px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .won .btn{font-size:11px; padding:10px 16px}

  :focus-visible{outline:2px solid var(--ember); outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
  @media (max-width:480px){
    body{padding-left:6px; padding-right:6px; padding-block:14px 24px}
    .wrap{gap:10px}
  }
  /* A touchscreen gets swipe-to-push instead — the d-pad is for mouse/keyboard use */
  @media (pointer:coarse){
    .pad{display:none}
  }
  canvas{touch-action:none}
</style>

<a href="../../games.html" style="position:fixed;top:8px;left:8px;z-index:50;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:.08em;color:#ccc;text-decoration:none;border:1px solid rgba(255,255,255,.18);padding:4px 8px;background:rgba(0,0,0,.55)">&larr; GAMES</a>
<div class="wrap">
  <header>
    <div>
      <h1>Recoil</h1>
      <p class="tag">A pushed box carries no friction of its own. It slides until something stops it — and if that something is another box, the push doesn't end, it changes hands.</p>
    </div>
    <div class="scoreboard">
      <span>MOVES <b id="moves">0</b></span>
    </div>
  </header>

  <div class="ribbon" id="ribbon"></div>

  <div class="stage">
    <div class="boardbox">
      <canvas id="board" width="320" height="240"></canvas>
      <div class="glow"></div>
      <div class="won" id="won">
        <div>
          <h3>Settled</h3>
          <p id="wonSub"></p>
          <button class="btn" id="nextBtn">NEXT</button>
        </div>
      </div>
    </div>
  </div>

  <p class="teach" id="teach"></p>
  <p class="flash" id="flash"></p>

  <div class="controls">
    <div class="pad">
      <button class="u" data-dir="U" aria-label="Push/walk up">&#9650;</button>
      <button class="l" data-dir="L" aria-label="Push/walk left">&#9664;</button>
      <button class="d" data-dir="D" aria-label="Push/walk down">&#9660;</button>
      <button class="r" data-dir="R" aria-label="Push/walk right">&#9654;</button>
    </div>
    <div>
      <div class="btnrow">
        <button class="btn" id="undoBtn">UNDO</button>
        <button class="btn" id="restartBtn">RESTART</button>
      </div>
      <p class="keys">
        <kbd>&uarr;&darr;&larr;&rarr;</kbd> / swipe to walk or push &nbsp;
        <kbd>Z</kbd> undo &nbsp; <kbd>R</kbd> restart
      </p>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script>
(function(){
  'use strict';
  var E = window.RecoilEngine, LEVELS = window.RecoilLevels;
  var PAR = [1,1,2,2];
  var TILE = 16;

  function surface(w,h){
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var x=c.getContext('2d'); x.imageSmoothingEnabled=false; return {c:c,x:x};
  }
  function P(x,a,b,col){ x.fillStyle=col; x.fillRect(a,b,1,1); }
  function R(x,a,b,w,h,col){ x.fillStyle=col; x.fillRect(a,b,w,h); }
  function hash(a,b){ var n=(a*73856093)^(b*19349663); n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967296; }

  var C = {
    floor:'#111319', floorHi:'#181b22', floorLo:'#0b0c10', grit:'#20242e',
    wall:'#0c0d11', wallTop:'#1c1f27', wallLo:'#050608',
    ice:'#173036', iceHi:'#7fd8e8', iceLo:'#0e2024', iceGlint:'#c8f4fb',
    goal:'#2a1608', goalRing:'#ff8a3d', goalRingHi:'#ffc79a',
    box:'#454b59', boxHi:'#6b7386', boxLo:'#242833', boxOn:'#5c3d24', boxOnHi:'#ff8a3d',
    player:'#e7ecf2', playerLo:'#9aa3b2', eye:'#12141a',
    trail:'#ff8a3d'
  };

  function paintFloor(x,gx,gy){
    R(x,0,0,16,16,C.floor);
    R(x,0,0,16,1,C.floorHi); R(x,0,15,16,1,C.floorLo);
    for(var i=0;i<7;i++){
      var h1=hash(gx*16+i,gy*7+i*3);
      if(h1>0.6) P(x,(h1*16)|0,((hash(gy+i,gx-i)*13)|0)+1,C.grit);
    }
  }
  function paintWall(x,gx,gy){
    R(x,0,0,16,16,C.wall);
    R(x,0,0,16,2,C.wallTop); R(x,0,14,16,2,C.wallLo);
  }
  function paintIce(x,gx,gy,t){
    R(x,0,0,16,16,C.ice);
    R(x,0,0,16,1,C.iceHi); R(x,0,15,16,1,C.iceLo);
    var s=Math.sin(t/700+gx*0.7+gy)*2;
    R(x,3+s,4,7,1,C.iceGlint);
    R(x,6-s,10,5,1,C.iceGlint);
  }
  function paintGoal(x,gx,gy,onIce,t,filled){
    if(onIce) paintIce(x,gx,gy,t); else paintFloor(x,gx,gy);
    var pulse = filled ? 1 : 0.55+0.35*Math.sin(t/500);
    x.globalAlpha=pulse;
    R(x,3,3,10,1,C.goalRing); R(x,3,12,10,1,C.goalRing);
    R(x,3,3,1,10,C.goalRing); R(x,12,3,1,10,C.goalRing);
    if(filled){ R(x,5,5,6,6,C.goalRingHi); }
    x.globalAlpha=1;
  }
  function spriteBox(x,onGoal){
    R(x,2,3,12,11,onGoal?C.boxLo:C.boxLo);
    R(x,2,3,12,9,onGoal?C.boxOn:C.box);
    R(x,2,3,12,1,onGoal?C.boxOnHi:C.boxHi);
    R(x,2,3,1,9,onGoal?C.boxOnHi:C.boxHi);
    R(x,5,6,6,3,onGoal?C.boxOnHi:C.boxHi);
  }
  function spritePlayer(x,t){
    var b=Math.sin(t/380)>0?0:1;
    x.globalAlpha=.16; R(x,3,3+b,10,10,C.player); x.globalAlpha=1;
    R(x,5,4+b,6,7,C.playerLo);
    R(x,5,4+b,6,6,C.player);
    P(x,6,7+b,C.eye); P(x,9,7+b,C.eye);
  }

  var lvIndex=0, st=null, history=[], moves=0, won=false, trail=[], trailAge=0;
  var canvas=document.getElementById('board'), ctx=canvas.getContext('2d');
  var scale=3, tileBuf=surface(TILE,TILE);
  function $(id){ return document.getElementById(id); }

  var done={};
  try{ done=JSON.parse(localStorage.getItem('recoil.progress')||'{}')||{}; }catch(e){ done={}; }
  function save(){ try{ localStorage.setItem('recoil.progress',JSON.stringify(done)); }catch(e){} }

  function roman(n){ return ['I','II','III','IV','V','VI'][n-1]||String(n); }
  function isGoal(s,x,y){ return s.goals.indexOf(x+','+y) >= 0; }

  function load(i){
    lvIndex=i; st=E.parse(LEVELS[i]); history=[]; moves=0; won=false; trail=[];
    $('won').classList.remove('show');
    $('teach').innerHTML='<span class="lv">'+roman(i+1)+' &middot; '+LEVELS[i].name.toUpperCase()+'</span>'+LEVELS[i].teach;
    $('moves').textContent=moves;
    setFlash('');
    layout(); drawRibbon();
  }

  function layout(){
    var avail=(canvas.parentNode&&canvas.parentNode.clientWidth)||320;
    scale=Math.max(2,Math.min(6,Math.floor(avail/(st.w*TILE))));
    canvas.width=st.w*TILE*scale;
    canvas.height=st.h*TILE*scale;
    ctx.imageSmoothingEnabled=false;
  }

  function draw(t){
    if(!st) return;
    var S=scale;
    ctx.fillStyle='#050608'; ctx.fillRect(0,0,canvas.width,canvas.height);
    for(var gy=0;gy<st.h;gy++) for(var gx=0;gx<st.w;gx++){
      tileBuf.x.clearRect(0,0,TILE,TILE);
      var ch=st.terrain[gy][gx], goal=isGoal(st,gx,gy), onBox=!!st.boxes[gx+','+gy];
      if(ch==='#') paintWall(tileBuf.x,gx,gy);
      else if(goal) paintGoal(tileBuf.x,gx,gy,ch==='~',t,onBox);
      else if(ch==='~') paintIce(tileBuf.x,gx,gy,t);
      else paintFloor(tileBuf.x,gx,gy);
      ctx.drawImage(tileBuf.c,gx*TILE*S,gy*TILE*S,TILE*S,TILE*S);
    }
    if(trail.length && trailAge < 14){
      ctx.globalAlpha = Math.max(0, 1 - trailAge/14) * 0.35;
      trail.forEach(function(k){
        var p=k.split(','); ctx.fillStyle=C.trail;
        ctx.fillRect((+p[0])*TILE*S+3*S,(+p[1])*TILE*S+3*S,10*S,10*S);
      });
      ctx.globalAlpha=1;
      trailAge++;
    }
    for(var k in st.boxes){
      var bp=k.split(',');
      tileBuf.x.clearRect(0,0,TILE,TILE); spriteBox(tileBuf.x, isGoal(st,+bp[0],+bp[1]));
      ctx.drawImage(tileBuf.c,(+bp[0])*TILE*S,(+bp[1])*TILE*S,TILE*S,TILE*S);
    }
    tileBuf.x.clearRect(0,0,TILE,TILE); spritePlayer(tileBuf.x,t);
    ctx.drawImage(tileBuf.c,st.px*TILE*S,st.py*TILE*S,TILE*S,TILE*S);
  }

  function setFlash(msg){ $('flash').textContent=msg||''; }

  function drawRibbon(){
    var r=$('ribbon'); r.innerHTML='';
    LEVELS.forEach(function(lv,i){
      var b=document.createElement('button');
      b.textContent=roman(i+1);
      b.title=lv.name;
      if(done[i]!=null) b.className='done';
      if(i===lvIndex) b.setAttribute('aria-current','true');
      b.onclick=function(){ load(i); };
      r.appendChild(b);
    });
  }

  function act(action){
    if(won) return;
    var res=E.step(st,action);
    if(!res.state){ setFlash(res.blocked||''); return; }
    history.push(E.clone(st));
    if(history.length>500) history.shift();
    st=res.state; moves++;
    trail = res.trail || []; trailAge = 0;
    $('moves').textContent=moves;
    setFlash('');
    if(E.isWin(st)) finish();
  }

  function finish(){
    won=true;
    if(done[lvIndex]==null||moves<done[lvIndex]) done[lvIndex]=moves;
    save(); drawRibbon();
    var par=PAR[lvIndex];
    $('wonSub').textContent = moves+' moves'+(par?' · best possible is '+par:'');
    $('nextBtn').textContent = lvIndex<LEVELS.length-1 ? 'NEXT' : 'START AGAIN';
    $('won').classList.add('show');
    $('nextBtn').focus();
  }

  function undo(){
    if(won||!history.length) return;
    st=history.pop(); moves=Math.max(0,moves-1);
    trail=[]; $('moves').textContent=moves; setFlash('');
  }

  var KEYMAP={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',
              w:'U',s:'D',a:'L',d:'R',W:'U',S:'D',A:'L',D:'R'};
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==='z'||e.key==='Z'){ e.preventDefault(); undo(); return; }
    if(e.key==='r'||e.key==='R'){ e.preventDefault(); load(lvIndex); return; }
    if(e.key==='Enter'&&won){ e.preventDefault(); $('nextBtn').click(); return; }
    var dir=KEYMAP[e.key];
    if(!dir) return;
    e.preventDefault();
    act(dir);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.pad button'),function(b){
    b.addEventListener('click',function(){ act(b.getAttribute('data-dir')); });
  });

  /* Swipe-to-push: a drag on the board itself, no d-pad required. */
  (function(){
    var sx=0, sy=0, tracking=false, MIN=24;
    canvas.addEventListener('touchstart',function(e){
      if(e.touches.length!==1) return;
      tracking=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY;
    },{passive:true});
    canvas.addEventListener('touchend',function(e){
      if(!tracking) return; tracking=false;
      var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<MIN) return;
      var dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?'R':'L') : (dy>0?'D':'U');
      act(dir);
    },{passive:true});
  })();

  $('undoBtn').onclick=undo;
  $('restartBtn').onclick=function(){ load(lvIndex); };
  $('nextBtn').onclick=function(){ load(lvIndex<LEVELS.length-1?lvIndex+1:0); };
  window.addEventListener('resize',function(){ if(st) layout(); });

  function start(resume){
    var i=(resume&&typeof resume.level==='number')?resume.level:0;
    load(Math.max(0,Math.min(LEVELS.length-1,i)));
    (function loop(t){ draw(t||0); requestAnimationFrame(loop); })(0);
  }
  if(window.claude&&window.claude.hot){
    window.claude.hot.snapshot(function(){ return {level:lvIndex}; });
    if(window.claude.hot.ready) window.claude.hot.ready(start);
    else start(window.claude.hot.data||{});
  } else {
    start({});
  }
})();
</script>
