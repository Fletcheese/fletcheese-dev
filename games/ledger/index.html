<title>Ledger</title>
<link rel="icon" type="image/svg+xml" href="../../favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jacquard+12&family=Silkscreen:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap">
<style>
  :root{
    --parchment:#161210; --parchment-2:#1e1814; --parchment-3:#271f19;
    --wood:#3a2c1f; --wood-lit:#5c452f;
    --brass:#c9a24a; --brass-hi:#f0d98a;
    --ink:#ece3d2; --ink-2:#ab9d84; --ink-3:#6f6455;
    --frame:#3a2f24;
    --a0:#c9704f; --a1:#5fb0a8; --a2:#c9a24a; --a3:#8fa6c9;
  }
  *{box-sizing:border-box}
  body{
    background:var(--parchment); color:var(--ink);
    font-family:"Newsreader",Georgia,serif;
    margin:0; padding-block:22px 40px; padding-left:16px; padding-right:16px;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
    background-image:radial-gradient(120% 90% at 50% 0%, #221b15 0%, var(--parchment) 62%);
  }
  .wrap{width:100%; max-width:820px; display:flex; flex-direction:column; gap:16px}

  header{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap}
  h1{
    font-family:"Jacquard 12",serif; font-weight:400;
    font-size:clamp(46px,11vw,72px); line-height:.78; margin:0;
    color:var(--brass); text-shadow:0 0 18px rgba(201,162,74,.28);
    letter-spacing:.02em;
  }
  .tag{font-size:13px; color:var(--ink-3); font-style:italic; margin:6px 0 0; max-width:48ch; line-height:1.5}
  .scoreboard{
    font-family:"Silkscreen",monospace; font-size:11px; letter-spacing:.09em;
    display:flex; gap:16px; align-items:baseline; color:var(--ink-2);
    font-variant-numeric:tabular-nums;
  }
  .scoreboard b{color:var(--ink); font-weight:400}

  .ribbon{display:flex; gap:5px; flex-wrap:wrap}
  .ribbon button{
    font-family:"Silkscreen",monospace; font-size:10px; letter-spacing:.06em;
    background:var(--parchment-2); color:var(--ink-3); border:1px solid var(--frame);
    padding:5px 7px; cursor:pointer; min-width:32px;
  }
  .ribbon button:hover{color:var(--ink); border-color:var(--wood-lit)}
  .ribbon button.done{color:var(--a1); border-color:#2c4a4f}
  .ribbon button[aria-current="true"]{background:var(--brass); border-color:var(--brass); color:#20180a}

  .stage{display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
  .boardbox{position:relative; flex:1 1 320px; min-width:260px}
  canvas{
    display:block; width:100%; height:auto; image-rendering:pixelated;
    border:1px solid var(--frame); background:#0d0a07;
  }
  .glow{position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 60px rgba(10,8,6,.7)}

  .ledgerbox{
    flex:0 0 260px; border:1px solid var(--frame); background:var(--parchment-2);
    padding:10px; display:flex; flex-direction:column; gap:8px;
  }
  .ledgerbox h2{
    font-family:"Silkscreen",monospace; font-size:9px; letter-spacing:.13em;
    color:var(--ink-3); margin:0; font-weight:400;
  }
  .rows{display:flex; flex-direction:column; gap:4px}
  .actorrow{
    display:flex; align-items:center; gap:8px; padding:5px 6px;
    border:1px solid var(--frame); background:var(--parchment-3);
  }
  .swatch{width:16px; height:16px; flex:0 0 16px; border:1px solid rgba(0,0,0,.4)}
  .rowtext{flex:1 1 auto; min-width:0}
  .rowtext .lbl{font-family:"Silkscreen",monospace; font-size:10px; letter-spacing:.04em; color:var(--ink)}
  .rowtext .rule{font-size:11px; color:var(--ink-3); font-style:italic; display:block; line-height:1.3}
  .rowbtns{display:flex; flex-direction:column; gap:2px}
  .rowbtns button{
    font-family:"Silkscreen",monospace; font-size:9px; line-height:1;
    background:var(--wood); color:var(--ink-2); border:1px solid var(--frame);
    cursor:pointer; padding:2px 5px;
  }
  .rowbtns button:hover:not(:disabled){color:var(--ink); border-color:var(--wood-lit)}
  .rowbtns button:disabled{opacity:.25; cursor:default}

  .wants{display:flex; flex-direction:column; gap:3px; font-family:"Silkscreen",monospace; font-size:9px; letter-spacing:.05em}
  .wants .w{display:flex; align-items:center; gap:6px; color:var(--ink-3)}
  .wants .w.ok{color:var(--a1)}
  .wants .sw{width:10px;height:10px;flex:0 0 10px; border:1px solid rgba(0,0,0,.4)}

  .playbtn{
    font-family:"Silkscreen",monospace; font-size:12px; letter-spacing:.1em;
    background:var(--brass); color:#20180a; border:1px solid var(--brass);
    padding:10px; cursor:pointer; text-align:center;
  }
  .playbtn:hover{background:var(--brass-hi)}

  .teach{font-size:16px; font-style:italic; color:var(--ink-2); margin:0; max-width:68ch; min-height:3.4em; line-height:1.45}
  .teach .lv{
    font-style:normal; font-family:"Silkscreen",monospace; font-size:11px;
    letter-spacing:.12em; color:var(--a1); display:block; margin-bottom:6px;
  }
  .flash{min-height:1.4em; font-family:"Silkscreen",monospace; font-size:10px; letter-spacing:.06em; color:var(--brass-hi); margin:0}

  .btnrow{display:flex; gap:6px; flex-wrap:wrap}
  .btn{
    font-family:"Silkscreen",monospace; font-size:10px; letter-spacing:.08em;
    background:var(--parchment-2); color:var(--ink-2); border:1px solid var(--frame);
    cursor:pointer; padding:9px 12px;
  }
  .btn:hover{color:var(--ink); border-color:var(--wood-lit)}

  .won{position:absolute; inset:0; display:none; place-content:center; text-align:center; background:rgba(10,8,6,.9); padding:18px}
  .won.show{display:grid}
  .won h3{font-family:"Jacquard 12",serif; font-weight:400; font-size:46px; margin:0 0 4px; color:var(--brass)}
  .won p{margin:0 0 14px; font-size:14px; color:var(--ink-2); font-variant-numeric:tabular-nums}
  .won .btn{font-size:11px; padding:10px 16px}

  :focus-visible{outline:2px solid var(--brass); outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
  @media (max-width:600px){ .stage{flex-direction:column} .ledgerbox{flex:1 1 auto; width:100%} }
  @media (max-width:480px){
    body{padding-left:6px; padding-right:6px; padding-block:14px 24px}
    .wrap{gap:10px}
  }
</style>

<a href="../../games.html" style="position:fixed;top:8px;left:8px;z-index:50;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:.08em;color:#ccc;text-decoration:none;border:1px solid rgba(255,255,255,.18);padding:4px 8px;background:rgba(0,0,0,.55)">&larr; GAMES</a>
<div class="wrap">
  <header>
    <div>
      <h1>Ledger</h1>
      <p class="tag">Nobody moves at your command. You set the order the witnesses testify in, and effects apply one at a time in that order — so who goes first decides who gets the tile.</p>
    </div>
    <div class="scoreboard">
      <span>ROUNDS <b id="rounds">0</b></span>
    </div>
  </header>

  <div class="ribbon" id="ribbon"></div>

  <div class="stage">
    <div class="boardbox">
      <canvas id="board" width="320" height="240"></canvas>
      <div class="glow"></div>
      <div class="won" id="won">
        <div>
          <h3>Resolved</h3>
          <p id="wonSub"></p>
          <button class="btn" id="nextBtn">NEXT</button>
        </div>
      </div>
    </div>

    <aside class="ledgerbox">
      <h2>THE ORDER</h2>
      <div class="rows" id="rows"></div>
      <button class="playbtn" id="playBtn">PLAY ROUND</button>
      <h2>WANTS</h2>
      <div class="wants" id="wants"></div>
    </aside>
  </div>

  <p class="teach" id="teach"></p>
  <p class="flash" id="flash"></p>

  <div class="btnrow">
    <button class="btn" id="undoBtn">UNDO ROUND</button>
    <button class="btn" id="restartBtn">RESTART</button>
  </div>
</div>

<script src="engine.js"></script>
<script src="levels.js"></script>
<script>
(function(){
  'use strict';
  var E = window.LedgerEngine, LEVELS = window.LedgerLevels;
  var PAR = [1,1,1,1];
  var TILE = 16;
  var ACOLOR = ['#c9704f','#5fb0a8','#c9a24a','#8fa6c9'];
  var ARROW = { U:'↑', D:'↓', L:'←', R:'→' };

  function surface(w,h){
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var x=c.getContext('2d'); x.imageSmoothingEnabled=false; return {c:c,x:x};
  }
  function R(x,a,b,w,h,col){ x.fillStyle=col; x.fillRect(a,b,w,h); }

  var lvIndex=0, st=null, history=[], won=false;
  var canvas=document.getElementById('board'), ctx=canvas.getContext('2d');
  var scale=3, tileBuf=surface(TILE,TILE);
  function $(id){ return document.getElementById(id); }

  var done={};
  try{ done=JSON.parse(localStorage.getItem('ledger.progress')||'{}')||{}; }catch(e){ done={}; }
  function save(){ try{ localStorage.setItem('ledger.progress',JSON.stringify(done)); }catch(e){} }

  function roman(n){ return ['I','II','III','IV','V','VI'][n-1]||String(n); }
  function actorLabel(i){ return String.fromCharCode(65+i); }

  function ruleText(a, idx){
    var arrow = ARROW[a.dir];
    if (a.kind==='follower') return 'follows '+actorLabel(a.ref)+', then walks '+arrow;
    return 'walks '+arrow+' every round';
  }

  function load(i){
    lvIndex=i; st=E.parse(LEVELS[i]); history=[]; won=false;
    $('won').classList.remove('show');
    $('teach').innerHTML='<span class="lv">'+roman(i+1)+' &middot; '+LEVELS[i].name.toUpperCase()+'</span>'+LEVELS[i].teach;
    setFlash('');
    layout(); drawRibbon(); syncRows(); syncWants();
  }

  function layout(){
    var avail=(canvas.parentNode&&canvas.parentNode.clientWidth)||320;
    scale=Math.max(2,Math.min(6,Math.floor(avail/(st.w*TILE))));
    canvas.width=st.w*TILE*scale;
    canvas.height=st.h*TILE*scale;
    ctx.imageSmoothingEnabled=false;
  }

  function isWant(actorIdx,x,y){
    for (var i=0;i<st.wants.length;i++){
      var w=st.wants[i];
      if (w.actor===actorIdx && w.x===x && w.y===y) return true;
    }
    return false;
  }
  function wantFor(actorIdx){
    for (var i=0;i<st.wants.length;i++) if (st.wants[i].actor===actorIdx) return st.wants[i];
    return null;
  }

  function draw(t){
    if(!st) return;
    var S=scale;
    ctx.fillStyle='#0d0a07'; ctx.fillRect(0,0,canvas.width,canvas.height);
    for(var gy=0;gy<st.h;gy++) for(var gx=0;gx<st.w;gx++){
      var ch=st.terrain[gy][gx];
      var col = ch==='#' ? '#211a13' : '#241d16';
      R(ctx, gx*TILE*S, gy*TILE*S, TILE*S, TILE*S, col);
      if (ch==='#'){
        ctx.fillStyle='#120e0a';
        ctx.fillRect(gx*TILE*S, gy*TILE*S, TILE*S, 2*S);
      }
    }
    /* want rings, drawn under the actors */
    st.wants.forEach(function(w,i){
      var col = ACOLOR[w.actor % ACOLOR.length];
      var satisfied = st.actors[w.actor].x===w.x && st.actors[w.actor].y===w.y;
      var pulse = satisfied ? 1 : 0.5+0.35*Math.sin(t/500+w.actor);
      ctx.globalAlpha=pulse;
      ctx.strokeStyle=col; ctx.lineWidth=2*S;
      ctx.strokeRect(w.x*TILE*S+3*S, w.y*TILE*S+3*S, 10*S, 10*S);
      ctx.globalAlpha=1;
    });
    /* actors */
    st.actors.forEach(function(a,i){
      var col=ACOLOR[i%ACOLOR.length];
      var px=a.x*TILE*S, py=a.y*TILE*S;
      R(ctx,px+2*S,py+2*S,12*S,12*S,'#000');
      R(ctx,px+2*S,py+2*S,11*S,11*S,col);
      ctx.fillStyle='#000'; ctx.font=(9*S)+'px Silkscreen, monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(actorLabel(i), px+8*S, py+8*S+S);
    });
  }

  function syncRows(){
    var box=$('rows'); box.innerHTML='';
    st.order.forEach(function(actorIdx,pos){
      var a = st.actors[actorIdx];
      var row=document.createElement('div'); row.className='actorrow';
      var sw=document.createElement('div'); sw.className='swatch'; sw.style.background=ACOLOR[actorIdx%ACOLOR.length];
      row.appendChild(sw);
      var txt=document.createElement('div'); txt.className='rowtext';
      var lbl=document.createElement('span'); lbl.className='lbl'; lbl.textContent=actorLabel(actorIdx)+' · '+(pos+1);
      var rule=document.createElement('span'); rule.className='rule'; rule.textContent=ruleText(a);
      txt.appendChild(lbl); txt.appendChild(rule);
      row.appendChild(txt);
      var btns=document.createElement('div'); btns.className='rowbtns';
      var up=document.createElement('button'); up.textContent='▲'; up.disabled=(pos===0);
      up.onclick=function(){ act({type:'swap', i:pos-1}); };
      var down=document.createElement('button'); down.textContent='▼'; down.disabled=(pos===st.order.length-1);
      down.onclick=function(){ act({type:'swap', i:pos}); };
      btns.appendChild(up); btns.appendChild(down);
      row.appendChild(btns);
      box.appendChild(row);
    });
  }

  function syncWants(){
    var box=$('wants'); box.innerHTML='';
    st.wants.forEach(function(w){
      var a=st.actors[w.actor];
      var ok = a.x===w.x && a.y===w.y;
      var row=document.createElement('div'); row.className='w'+(ok?' ok':'');
      var sw=document.createElement('span'); sw.className='sw'; sw.style.background=ACOLOR[w.actor%ACOLOR.length];
      row.appendChild(sw);
      var lbl=document.createElement('span');
      lbl.textContent = actorLabel(w.actor)+' → ('+w.x+','+w.y+')'+(ok?' ✓':'');
      row.appendChild(lbl);
      box.appendChild(row);
    });
    $('rounds').textContent = st.round;
  }

  function setFlash(msg){ $('flash').textContent=msg||''; }

  function drawRibbon(){
    var r=$('ribbon'); r.innerHTML='';
    LEVELS.forEach(function(lv,i){
      var b=document.createElement('button');
      b.textContent=roman(i+1);
      b.title=lv.name;
      if(done[i]!=null) b.className='done';
      if(i===lvIndex) b.setAttribute('aria-current','true');
      b.onclick=function(){ load(i); };
      r.appendChild(b);
    });
  }

  function act(action){
    if(won) return;
    var res=E.step(st,action);
    if(!res.state){ setFlash(res.blocked||''); return; }
    history.push(E.clone(st));
    if(history.length>200) history.shift();
    st=res.state;
    setFlash('');
    syncRows(); syncWants();
    if(action.type==='play' && E.isWin(st)) finish();
  }

  function finish(){
    won=true;
    if(done[lvIndex]==null||st.round<done[lvIndex]) done[lvIndex]=st.round;
    save(); drawRibbon();
    var par=PAR[lvIndex];
    $('wonSub').textContent = st.round+' round'+(st.round===1?'':'s')+(par?' · best possible is '+par:'');
    $('nextBtn').textContent = lvIndex<LEVELS.length-1 ? 'NEXT' : 'START AGAIN';
    $('won').classList.add('show');
    $('nextBtn').focus();
  }

  function undo(){
    if(won||!history.length) return;
    st=history.pop();
    setFlash(''); syncRows(); syncWants();
  }

  $('playBtn').onclick=function(){ act({type:'play'}); };
  $('undoBtn').onclick=undo;
  $('restartBtn').onclick=function(){ load(lvIndex); };
  $('nextBtn').onclick=function(){ load(lvIndex<LEVELS.length-1?lvIndex+1:0); };
  window.addEventListener('resize',function(){ if(st) layout(); });
  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==='z'||e.key==='Z'){ e.preventDefault(); undo(); return; }
    if(e.key==='r'||e.key==='R'){ e.preventDefault(); load(lvIndex); return; }
    if(e.key===' '){ e.preventDefault(); $('playBtn').click(); return; }
    if(e.key==='Enter'&&won){ e.preventDefault(); $('nextBtn').click(); return; }
  });

  function start(resume){
    var i=(resume&&typeof resume.level==='number')?resume.level:0;
    load(Math.max(0,Math.min(LEVELS.length-1,i)));
    (function loop(t){ draw(t||0); requestAnimationFrame(loop); })(0);
  }
  if(window.claude&&window.claude.hot){
    window.claude.hot.snapshot(function(){ return {level:lvIndex}; });
    if(window.claude.hot.ready) window.claude.hot.ready(start);
    else start(window.claude.hot.data||{});
  } else {
    start({});
  }
})();
</script>
